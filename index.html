<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h1>Game of Life</h1>

            <div class="control-group">
                <h3>Simulation Controls</h3>
                <div class="button-row">
                    <button id="startPauseBtn" class="primary">Start</button>
                    <button id="stepBtn">Step</button>
                </div>
                <div class="button-row">
                    <button id="clearBtn" class="danger">Clear</button>
                    <button id="randomizeBtn">Randomize</button>
                </div>
            </div>

            <div class="control-group">
                <h3>Speed Settings</h3>
                <label>Ticks/sec: <span id="speedValue">10</span></label>
                <input type="range" id="speedSlider" min="1" max="60" value="10">
            </div>

            <div class="control-group">
                <h3>Grid Settings</h3>
                <label>Rows: <input type="number" id="rowsInput" min="10" max="200" value="50"></label>
                <label>Cols: <input type="number" id="colsInput" min="10" max="200" value="50"></label>
                <button id="applySizeBtn">Apply Size</button>
            </div>

            <div class="control-group">
                <h3>Presets</h3>
                <select id="presetsSelect">
                    <option value="none">None</option>
                    <option value="glider">Glider</option>
                    <option value="gosperGliderGun">Gosper Glider Gun</option>
                    <option value="pulsar">Pulsar</option>
                    <option value="beacon">Beacon</option>
                </select>
                <button id="applyPresetBtn">Apply Preset</button>
                <p class="help-text">Click and drag on the grid to draw!</p>
            </div>
        </aside>
        <main class="canvas-container" id="canvasContainer">
            <div id="statusOverlay">
                <span>Generation: <span id="genCount">0</span></span> |
                <span>Alive: <span id="aliveCount">0</span></span>
            </div>
            <canvas id="gameCanvas"></canvas>
        </main>
    </div>
    <script src="game.js"></script>
</body>
</html>
